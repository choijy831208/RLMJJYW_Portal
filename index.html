<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 포털 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <h2><i class="fas fa-robot"></i> 우리 가족 AI 비서 </h2>
        <input type="text" id="username" placeholder="ID를 입력하세요">
        <input type="password" id="password" placeholder="비밀번호를 입력하세요...">
        <button id="login-btn"><i class="fas fa-unlock"></i> 로그인</button>
        <p id="error-msg"></p>
    </div>

    <div class="browser-window" id="browser-window" style="display: none;">
        <div class="browser-content">
            <div class="ai-speaker" aria-hidden="true">
                <i class="fas fa-volume-up"></i>
                <div class="dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div id="dashboard">
                <header class="dashboard-header">
                    <h2>우리 가족 포털</h2>
                    <p id="greeting"></p>
                    <button id="dark-mode-toggle" class="dark-mode-toggle" type="button" title="다크 모드">🌙</button>
                </header>

                <div class="widgets-grid">
                    <!-- 좌상단: 달력 위젯 -->
                    <section class="card calendar-widget" id="calendar-widget">
                        <div class="card-header">
                            <i class="fas fa-calendar-alt"></i>
                            <h3>달력</h3>
                            <div class="cal-view-toggle">
                                <button class="cal-view-btn active" id="btn-cal-view" title="달력 형식" type="button"><i class="fas fa-calendar"></i></button>
                                <button class="cal-view-btn" id="btn-list-view" title="리스트 형식" type="button"><i class="fas fa-list-ul"></i></button>
                                <span class="cal-mode-label" id="cal-mode-label">달력</span>
                            </div>
                        </div>

                        <!-- 달력 형식 -->
                        <div id="cal-calendar-view">
                            <div class="cal-nav">
                                <button type="button" id="cal-prev"><i class="fas fa-chevron-left"></i></button>
                                <span id="cal-month-title"></span>
                                <button type="button" id="cal-next"><i class="fas fa-chevron-right"></i></button>
                            </div>
                            <table class="cal-table">
                                <thead>
                                    <tr>
                                        <th class="sun">일</th><th>월</th><th>화</th>
                                        <th>수</th><th>목</th><th>금</th><th class="sat">토</th>
                                    </tr>
                                </thead>
                                <tbody id="cal-body"></tbody>
                            </table>
                            <div class="cal-summary" id="cal-summary"></div>
                        </div>

                        <!-- 리스트 형식 -->
                        <div id="cal-list-view" style="display:none;">
                            <div id="cal-list-body"></div>
                        </div>

                        <!-- 일정 입력 -->
                        <div class="cal-input-area">
                            <input type="text" id="cal-input" placeholder="일정 제목 입력">
                            <div class="cal-input-row">
                                <select id="cal-member">
                                    <option value="">참여자</option>
                                    <option value="엄마">엄마</option>
                                    <option value="아빠">아빠</option>
                                    <option value="첫째">첫째</option>
                                    <option value="둘째">둘째</option>
                                    <option value="가족">가족 전체</option>
                                </select>
                                <select id="cal-type">
                                    <option value="family">가족 행사</option>
                                    <option value="personal">개인 일정</option>
                                </select>
                                <input type="date" id="cal-date">
                                <input type="time" id="cal-time-start">
                                <button type="button" id="cal-add-btn"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </section>

                    <section class="card memo-widget">
                        <div class="card-header">
                            <i class="fas fa-note-sticky"></i>
                            <h3>메모장</h3>
                        </div>
                        <textarea id="notes" placeholder="가족 메모, 오늘 할 일, 식단 계획..."></textarea>
                        <div class="memo-icons" aria-hidden="true">
                            <i class="fas fa-laptop"></i>
                            <i class="fas fa-pencil"></i>
                        </div>
                        <button id="save-notes" type="button">메모 저장</button>
                    </section>

                    <section class="card news-widget">
                        <div class="card-header">
                            <i class="fas fa-newspaper"></i>
                            <h3>뉴스 정보</h3>
                        </div>
                        <div class="news-ticker">실시간 이슈를 감성적으로 정리해 드립니다</div>
                        <ul id="news-feed" class="news-list"></ul>
                    </section>

                    <section class="card asset-widget">
                        <div class="card-header">
                            <i class="fas fa-chart-line"></i>
                            <h3>자산 요약</h3>
                        </div>
                        <div class="asset-summary">
                            <p>총 자산: <strong id="asset-total">0원</strong></p>
                            <p>대출: <strong id="asset-loan">0원</strong></p>
                            <p>순자산: <strong id="asset-net">0원</strong></p>
                        </div>
                        <div class="asset-chart">
                            <div class="bar-wrap"><span>총자산</span><div class="bar" id="bar-total"></div></div>
                            <div class="bar-wrap"><span>대출</span><div class="bar loan" id="bar-loan"></div></div>
                            <div class="bar-wrap"><span>순자산</span><div class="bar net" id="bar-net"></div></div>
                        </div>
                        <div class="asset-icons" aria-hidden="true">
                            <i class="fas fa-wallet"></i>
                            <i class="fas fa-building-columns"></i>
                            <i class="fas fa-credit-card"></i>
                        </div>
                        <div class="asset-inputs">
                            <input type="number" id="input-total" placeholder="총 자산">
                            <input type="number" id="input-loan" placeholder="대출">
                            <button id="save-assets" type="button">자산 반영</button>
                        </div>
                        <div class="ai-character">
                            <i class="fas fa-robot"></i>
                            <p>이렇게 관리해 드릴게요</p>
                        </div>
                    </section>
                </div>

                <button id="logout-btn" type="button">로그아웃</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
