<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 포털 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=20260415-2">
</head>
<body>
    <div id="login-container">
        <h2>우리 가족 AI 비서</h2>
        <input type="text" id="username" placeholder="ID를 입력하세요">
        <input type="password" id="password" placeholder="비밀번호를 입력하세요...">
        <label class="remember-id-wrap" for="remember-id">
            <input type="checkbox" id="remember-id"> 아이디 저장하기
        </label>
        <button id="login-btn"><i class="fas fa-unlock"></i> 로그인</button>
        <button id="open-signup-btn" type="button" class="signup-btn"><i class="fas fa-user-plus"></i> 계정 추가</button>
        <button id="reset-client-data-btn" type="button" class="reset-client-data-btn">휴대폰 데이터 초기화</button>
        <p id="error-msg"></p>
    </div>

    <div id="signup-modal" class="account-modal" style="display:none;">
        <div class="account-modal-backdrop" data-close="signup"></div>
        <div class="account-modal-panel" role="dialog" aria-modal="true" aria-labelledby="signup-modal-title">
            <div class="account-modal-head">
                <h4 id="signup-modal-title">계정 추가</h4>
                <button id="signup-close-btn" type="button" class="account-modal-close">닫기</button>
            </div>
            <label class="account-modal-label">ID
                <input id="signup-id" type="text" autocomplete="off" placeholder="새 ID 입력">
            </label>
            <label class="account-modal-label">Password
                <input id="signup-password" type="password" placeholder="비밀번호 입력">
            </label>
            <label class="account-modal-label">Password 확인
                <input id="signup-password-confirm" type="password" placeholder="비밀번호 다시 입력">
            </label>
            <label class="account-modal-label">참여자 리스트 (한 줄에 한 명)
                <textarea id="signup-participants" class="account-modal-textarea" placeholder="예)&#10;아빠&#10;엄마&#10;첫째&#10;둘째"></textarea>
            </label>
            <div class="account-modal-actions">
                <button id="signup-submit-btn" type="button">계정 생성</button>
                <button id="signup-cancel-btn" type="button" class="ghost">취소</button>
            </div>
        </div>
    </div>

    <div class="browser-window" id="browser-window" style="display: none;">
        <div class="browser-content">
            <div class="ai-speaker" aria-hidden="true">
                <i class="fas fa-volume-up"></i>
                <div class="dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div id="dashboard">
                <header class="dashboard-header">
                    <h2>우리 가족 포털</h2>
                    <div class="portal-tabs" role="tablist" aria-label="포털 관리 메뉴">
                        <button type="button" class="portal-tab-btn active" data-tab="schedule">스케쥴관리</button>
                        <button type="button" class="portal-tab-btn" data-tab="asset">자산관리</button>
                        <button type="button" class="portal-tab-btn" data-tab="report">뉴스데스크</button>
                    </div>
                    <p id="greeting"></p>
                    <button id="account-settings-btn" class="account-settings-btn" type="button" title="계정 편집"><i class="fas fa-user-gear"></i></button>
                    <button id="dark-mode-toggle" class="dark-mode-toggle" type="button" title="다크 모드">🌙</button>
                </header>

                <div class="widgets-grid">
                    <!-- 좌상단: 달력 위젯 -->
                    <section class="card calendar-widget" id="calendar-widget">
                        <div class="card-header">
                            <i class="fas fa-calendar-alt"></i>
                            <h3>달력</h3>
                            <div class="cal-view-toggle">
                                <button class="cal-view-btn active" id="btn-cal-view" title="달력 형식" type="button"><i class="fas fa-calendar"></i></button>
                                <button class="cal-view-btn" id="btn-list-view" title="리스트 형식" type="button"><i class="fas fa-list-ul"></i></button>
                                <span class="cal-mode-label" id="cal-mode-label">달력</span>
                            </div>
                        </div>

                        <!-- 달력 형식 -->
                        <div id="cal-calendar-view">
                            <div class="cal-nav">
                                <button type="button" id="cal-prev"><i class="fas fa-chevron-left"></i></button>
                                <span id="cal-month-title"></span>
                                <button type="button" id="cal-next"><i class="fas fa-chevron-right"></i></button>
                            </div>
                            <table class="cal-table">
                                <thead>
                                    <tr>
                                        <th class="sun">일</th><th>월</th><th>화</th>
                                        <th>수</th><th>목</th><th>금</th><th class="sat">토</th>
                                    </tr>
                                </thead>
                                <tbody id="cal-body"></tbody>
                            </table>
                            <div class="cal-summary" id="cal-summary"></div>
                        </div>

                        <!-- 리스트 형식 -->
                        <div id="cal-list-view" style="display:none;">
                            <div id="cal-list-body"></div>
                        </div>

                        <!-- 일정 입력 -->
                        <div class="cal-input-area">
                            <div class="cal-input-row cal-input-top-row">
                                <select id="cal-type">
                                    <option value="family">가족 행사</option>
                                    <option value="personal">개인 일정</option>
                                </select>
                                <div id="cal-member-picker" class="cal-member-picker">
                                    <button type="button" id="cal-member-toggle" class="cal-member-toggle">참여자 선택</button>
                                    <div id="cal-member-menu" class="cal-member-menu" style="display:none;"></div>
                                </div>
                                <input type="text" id="cal-input" placeholder="일정 제목 입력">
                            </div>
                            <div class="cal-input-row cal-input-bottom-row">
                                <input type="date" id="cal-date-start" aria-label="시작일">
                                <input type="date" id="cal-date-end" aria-label="종료일">
                                <input type="time" id="cal-time-start">
                                <label class="cal-all-day-label" for="cal-all-day">
                                    <input type="checkbox" id="cal-all-day">종일
                                </label>
                                <button type="button" id="cal-add-btn"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </section>

                    <section class="card memo-widget" id="memo-widget">
                        <div class="card-header">
                            <i class="fas fa-note-sticky"></i>
                            <h3>메모장</h3>
                        </div>
                        <textarea id="notes" placeholder="가족 메모, 오늘 할 일, 식단 계획..."></textarea>
                        <div class="memo-icons" aria-hidden="true">
                            <i class="fas fa-laptop"></i>
                            <i class="fas fa-pencil"></i>
                        </div>
                        <div class="memo-input-actions">
                            <button id="save-notes" type="button">메모 저장</button>
                            <button id="memo-voice-start" type="button" class="memo-voice-btn">음성 입력 시작</button>
                            <button id="memo-voice-stop" type="button" class="memo-voice-btn" disabled>음성 입력 중지</button>
                        </div>
                        <div id="memo-voice-status" class="memo-voice-status"></div>
                        <div class="memo-log">
                            <div id="memo-log-title" class="memo-log-title">저장된 메모 (0)</div>
                            <div id="memo-list" class="memo-list"></div>
                        </div>
                    </section>

                    <section class="card news-widget" id="news-widget">
                        <div class="card-header">
                            <i class="fas fa-newspaper"></i>
                            <h3>뉴스 정보</h3>
                        </div>
                        <div class="news-ticker">실시간 이슈를 감성적으로 정리해 드립니다</div>
                        <ul id="news-feed" class="news-list"></ul>
                    </section>

                    <section class="card asset-widget" id="asset-widget">
                        <div class="card-header">
                            <i class="fas fa-chart-line"></i>
                            <h3>자산 요약</h3>
                        </div>
                        <div class="asset-summary">
                            <p>총 자산: <strong id="asset-total">0원</strong></p>
                            <p>대출: <strong id="asset-loan">0원</strong></p>
                            <p>순자산: <strong id="asset-net">0원</strong></p>
                        </div>
                        <div class="asset-chart">
                            <div class="bar-wrap"><span>총자산</span><div class="bar" id="bar-total"></div></div>
                            <div class="bar-wrap"><span>대출</span><div class="bar loan" id="bar-loan"></div></div>
                            <div class="bar-wrap"><span>순자산</span><div class="bar net" id="bar-net"></div></div>
                        </div>
                        <div class="asset-icons" aria-hidden="true">
                            <i class="fas fa-wallet"></i>
                            <i class="fas fa-building-columns"></i>
                            <i class="fas fa-credit-card"></i>
                        </div>
                        <div class="asset-inputs">
                            <input type="number" id="input-total" placeholder="총 자산">
                            <input type="number" id="input-loan" placeholder="대출">
                            <button id="save-assets" type="button">자산 반영</button>
                        </div>
                        <div class="ai-character">
                            <i class="fas fa-robot"></i>
                            <p>이렇게 관리해 드릴게요</p>
                        </div>
                    </section>
                </div>

                <button id="logout-btn" type="button">로그아웃</button>
            </div>
        </div>
    </div>

    <div id="account-edit-modal" class="account-modal" style="display:none;">
        <div class="account-modal-backdrop" data-close="account-edit"></div>
        <div class="account-modal-panel" role="dialog" aria-modal="true" aria-labelledby="account-edit-modal-title">
            <div class="account-modal-head">
                <h4 id="account-edit-modal-title">계정 편집</h4>
                <button id="account-edit-close-btn" type="button" class="account-modal-close">닫기</button>
            </div>
            <label class="account-modal-label">새 Password
                <input id="account-edit-password" type="password" placeholder="변경하지 않으면 비워두세요">
            </label>
            <label class="account-modal-label">새 Password 확인
                <input id="account-edit-password-confirm" type="password" placeholder="비밀번호 다시 입력">
            </label>
            <label class="account-modal-label">참여자 리스트 (한 줄에 한 명)
                <textarea id="account-edit-participants" class="account-modal-textarea" placeholder="참여자 입력"></textarea>
            </label>
            <div class="account-modal-actions">
                <button id="account-edit-save-btn" type="button">저장</button>
                <button id="account-edit-cancel-btn" type="button" class="ghost">취소</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="script.js?v=20260415-2"></script>
</body>
</html>
